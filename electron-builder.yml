appId: com.ayprom.photo-processor
productName: AYPROM
directories:
  output: release
files:
  - dist/**/*
  - assets/app-icon.png
  - package.json
asar: true
asarUnpack:
  - node_modules/sharp/**/*
  - node_modules/@img/**/*
extraResources:
  - from: watermark-pattern-figma.svg
    to: watermark-pattern-figma.svg
  - from: assets/app-icon.png
    to: app-icon.png
compression: maximum
npmRebuild: false
win:
  target:
    - nsis
    - portable
  executableName: AYPROM
  icon: assets/app.ico
  signExecutable: false
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createStartMenuShortcut: true
  createDesktopShortcut: true
  runAfterFinish: true
  installerLanguages: [ru_RU]
  include: build/installer.nsh
  installerIcon: assets/app.ico
  uninstallerIcon: assets/app.ico
  artifactName: AYPROM-Setup.${ext}
portable:
  artifactName: AYPROM-Portable-${version}.${ext}
publish:
  provider: github
  owner: kwelves
  repo: ayprom-app
  releaseType: draft
