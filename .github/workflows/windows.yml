name: Windows
on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: node scripts/qa-presets.mjs
      - run: node scripts/qa.mjs
      - run: node scripts/extract-fixture.mjs
      - run: npm run regression -- .tmp/embedded-fixture
      - run: npm run package
      - run: npm run verify:update
      - run: node scripts/qa-installer.mjs
      - run: node scripts/qa.mjs "release/win-unpacked/AYPROM.exe" ".tmp/embedded-fixture/figma-reference.png"
      - shell: pwsh
        run: |
          $taskPortable = (Get-ChildItem release/*Portable*.exe | Select-Object -First 1).FullName
          node scripts/qa-portable.mjs "$taskPortable" ".tmp/embedded-fixture/figma-reference.png"
      - name: Verify NSIS installation
        shell: pwsh
        run: |
          $taskDirectory = Join-Path $env:RUNNER_TEMP 'ayprom-installed-qa'
          $taskInstaller = (Resolve-Path 'release/AYPROM-Setup.exe').Path
          $taskProcess = Start-Process -FilePath $taskInstaller -ArgumentList @('/S', "/D=$taskDirectory") -WindowStyle Hidden -PassThru -Wait
          if ($taskProcess.ExitCode -ne 0) { throw 'Installer failed' }
          node scripts/qa.mjs "$taskDirectory/AYPROM.exe" ".tmp/embedded-fixture/figma-reference.png"
      - run: node scripts/checksums.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: windows-builds
          path: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
            release/SHA256SUMS.txt
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-evidence
          include-hidden-files: true
          path: |
            .tmp/qa-*/report.json
            .tmp/qa-*/*.png
            .tmp/portable-qa-*/report.json
            .tmp/presets-qa-*/report.json
            .tmp/installer-qa-*/report.json
            .tmp/regression-*/report.json
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Verify tag matches package version
        shell: pwsh
        run: |
          $taskVersion = (Get-Content package.json | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$taskVersion") {
            throw "Tag $env:GITHUB_REF_NAME does not match package version $taskVersion"
          }
      - name: Create single draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $taskVersion = (Get-Content package.json | ConvertFrom-Json).version
          gh release view $env:GITHUB_REF_NAME *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:GITHUB_REF_NAME --draft --title "AYPROM $taskVersion" --notes "Unsigned Windows bootstrap release. Review CI evidence and docs/UPDATES.md before manually publishing this draft."
          }
      - name: Build and upload electron-builder draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: npm run package:publish
      - run: npm run verify:update
      - run: node scripts/qa-installer.mjs
      - run: node scripts/extract-fixture.mjs
      - run: node scripts/qa.mjs "release/win-unpacked/AYPROM.exe" ".tmp/embedded-fixture/figma-reference.png"
      - name: Verify release Portable
        shell: pwsh
        run: |
          $taskPortable = (Get-ChildItem release/*Portable*.exe | Select-Object -First 1).FullName
          node scripts/qa-portable.mjs "$taskPortable" ".tmp/embedded-fixture/figma-reference.png"
      - name: Verify release NSIS installation
        shell: pwsh
        run: |
          $taskDirectory = Join-Path $env:RUNNER_TEMP 'ayprom-release-installed-qa'
          $taskInstaller = (Resolve-Path 'release/AYPROM-Setup.exe').Path
          $taskProcess = Start-Process -FilePath $taskInstaller -ArgumentList @('/S', "/D=$taskDirectory") -WindowStyle Hidden -PassThru -Wait
          if ($taskProcess.ExitCode -ne 0) { throw 'Installer failed' }
          node scripts/qa.mjs "$taskDirectory/AYPROM.exe" ".tmp/embedded-fixture/figma-reference.png"
      - run: node scripts/checksums.mjs
      - name: Attach checksums and verify draft assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $taskVersion = (Get-Content package.json | ConvertFrom-Json).version
          gh release edit $env:GITHUB_REF_NAME --draft --title "AYPROM $taskVersion" --notes "Unsigned Windows bootstrap release. Review CI evidence and docs/UPDATES.md before manually publishing this draft."
          gh release upload $env:GITHUB_REF_NAME release/SHA256SUMS.txt --clobber
          $taskRelease = gh release view $env:GITHUB_REF_NAME --json isDraft,assets | ConvertFrom-Json
          if (-not $taskRelease.isDraft) { throw 'Release must remain draft' }
          $taskNames = @($taskRelease.assets | ForEach-Object name)
          foreach ($taskRequired in @('AYPROM-Setup.exe', 'AYPROM-Setup.exe.blockmap', 'latest.yml', "AYPROM-Portable-$taskVersion.exe", 'SHA256SUMS.txt')) {
            if ($taskRequired -notin $taskNames) { throw "Missing release asset: $taskRequired" }
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-qa-evidence
          include-hidden-files: true
          path: |
            .tmp/qa-*/report.json
            .tmp/qa-*/*.png
            .tmp/portable-qa-*/report.json
            .tmp/installer-qa-*/report.json
            .tmp/regression-*/report.json
